[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentboard"
version = "0.1.0"
description = "A small, local-first trace explorer for coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "opentelemetry-proto>=1.30,<2"]

[project.optional-dependencies]
models = ["openai>=1.60,<3"]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "ruff>=0.11,<1",
    "openai>=1.60,<3",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.scripts]
agentboard = "agentboard.cli:main"

[tool.uv]
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["backend/agentboard"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/app.js" = "agentboard/static/app.js"
"frontend/demo.jsonl" = "agentboard/static/demo.jsonl"
"frontend/index.html" = "agentboard/static/index.html"
"frontend/provenance.js" = "agentboard/static/provenance.js"
"frontend/style.css" = "agentboard/static/style.css"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["e2e: opt-in tests that use an operator-provided external service"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agentboard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentboard"
version = "0.1.0"
description = "A small, local-first trace explorer for coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "opentelemetry-proto>=1.30,<2"]

[project.optional-dependencies]
models = ["openai>=1.60,<3"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1", "openai>=1.60,<3", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]

[project.scripts]
agentboard = "agentboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
